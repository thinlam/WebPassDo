services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: passdo-database
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      # Do not expose SQL to the public internet. Bind loopback only.
      - "${MSSQL_BIND:-127.0.0.1}:${MSSQL_PORT:-1434}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: passdo-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      # Set APPLY_MIGRATIONS=true only for Development / first boot. Do not enable blindly in Production.
      APPLY_MIGRATIONS: ${APPLY_MIGRATIONS:-true}
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=${MSSQL_DATABASE};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Google__ClientId: ${Google__ClientId:-}
      FileStorage__RootPath: /app/uploads
      FileStorage__RequestPath: /uploads
      # Override for production domain(s). Empty CORS_ORIGIN_2 is ignored by most setups — set when needed.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-http://localhost:3000}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2:-http://127.0.0.1:3000}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
    ports:
      # Prefer loopback on VPS so only frontend (or a reverse proxy) is public.
      # Local Windows: still reach Swagger at http://127.0.0.1:8081
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8081}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: passdo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mssql_data:
  uploads_data:
